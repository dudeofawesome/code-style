  - 'packages/eslint-config'
  - 'packages/eslint-config-browser'
  - 'packages/eslint-config-cli'
  - 'packages/eslint-config-esmodule'
  - 'packages/eslint-config-jest'
  - 'packages/eslint-config-nest'
  - 'packages/eslint-config-nextjs'
  - 'packages/eslint-config-node'
  - 'packages/eslint-config-react'
  - 'packages/eslint-config-typescript'
  - 'packages/eslint-plugin-nest'
  - 'packages/jest-configs'
  - 'packages/stylelint-config'
  - 'packages/stylelint-config-scss'
  - 'packages/typescript-configs'
  - 'packages/utils'
  - 'packages/testing'
