name: 'Publish NPM Package'

on:
  push:
    branches: ['*']
    tags-ignore: ['*']
  pull_request:

permissions:
  contents: 'read'

jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Setup node 🛎️'
        uses: 'dudeofawesome/actions/node-setup@a850bdff4354bdb891a86116f0378f8a890e2c16' # v1
      - name: 'Build 🏗️'
        run: 'npm run build'

  lint:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Setup node 🛎️'
        uses: 'dudeofawesome/actions/node-setup@a850bdff4354bdb891a86116f0378f8a890e2c16' # v1
      - name: 'Lint 🧪'
        run: 'npm run lint'

  test:
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        # 20.19 is the engines floor (ESLint 10's minimum); 22 is the build
        # version (.nvmrc); 24 is current
        node-version: ['20.19', '22', '24']
    steps:
      - name: 'Checkout 🛎️'
        uses: 'actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683' # v4
      - name: 'Setup node ${{ matrix.node-version }} 🛎️'
        uses: 'actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af' # v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'npm'
      - name: 'Install 📦'
        run: 'npm ci'
      - name: 'Test 🧪'
        run: 'npm run test'

  e2e:
    runs-on: 'ubuntu-latest'
    needs:
      - 'build'
    steps:
      - name: 'Setup node 🛎️'
        uses: 'dudeofawesome/actions/node-setup@a850bdff4354bdb891a86116f0378f8a890e2c16' # v1
      - name: 'Scaffold & lint a sample project 🧪'
        run: 'scripts/e2e-create-configs.sh'

  publish:
    runs-on: 'ubuntu-latest'
    environment: 'production'
    permissions:
      id-token: 'write'
      packages: 'write'
      contents: 'write'
    needs:
      - 'build'
      - 'lint'
      - 'test'
    steps:
      - name: 'Setup node 🛎️'
        uses: 'dudeofawesome/actions/node-setup@a850bdff4354bdb891a86116f0378f8a890e2c16' # v1
        with:
          install-modules: false

      - name: 'Publish to NPM 🚀'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_AUTH_TOKEN }}'
        uses: 'dudeofawesome/actions/npm-publish@a850bdff4354bdb891a86116f0378f8a890e2c16' # v1

      - name: 'Get package version 🔖'
        id: 'get-package-version'
        run: 'echo "version=v$(npm pkg get version | jq --raw-output)" >> "$GITHUB_OUTPUT"'
      - name: 'Build jsonschema 🏗️'
        run: 'npm run build:jsonschema --workspace packages/code-style'
      - name: 'Publish files to Github Releases 🚀'
        uses: 'softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564' # v2
        with:
          tag_name: '${{ steps.get-package-version.outputs.version }}'
          prerelease: "${{ contains(steps.get-package-version.outputs.version, '-') }}"
          generate_release_notes: true
          files: |
            packages/code-style/codestylerc.schema.json
